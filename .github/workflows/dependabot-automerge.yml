name: Dependabot Automerge

# workflow_run executes from the trusted default branch with access to Actions
# secrets. Never check out or execute the Dependabot PR's code in this workflow.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: write
  checks: write
  pull-requests: write
  statuses: write

jobs:
  automerge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure workflow-update merge key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPENDABOT_AUTOMERGE_SSH_KEY }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H github.com > "$HOME/.ssh/known_hosts"

      - name: Queue tested Dependabot PR for squash merge
        env:
          GH_TOKEN: ${{ secrets.GHA_PAT }}
          ACTIONS_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: dependabot[bot]
          GIT_AUTHOR_EMAIL: 49699333+dependabot[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          TESTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(
              gh api "repos/$GITHUB_REPOSITORY/commits/$TESTED_HEAD_SHA/pulls" \
                --jq '[.[] | select(.state == "open")][0].number // empty'
            )
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo 'The completed workflow is not associated with an open pull request'
            exit 0
          fi

          IFS=$'\t' read -r author base head draft state < <(
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
              --jq '[.user.login, .base.ref, .head.sha, (.draft | tostring), .state] | @tsv'
          )

          if [ "$author" != 'dependabot[bot]' ] || [ "$base" != 'master' ]; then
            echo "PR #$PR_NUMBER is not a Dependabot PR targeting master"
            exit 0
          fi

          if [ "$draft" != 'false' ] || [ "$state" != 'open' ]; then
            echo "PR #$PR_NUMBER is not an open, non-draft PR"
            exit 0
          fi

          if [ "$head" != "$TESTED_HEAD_SHA" ]; then
            echo "PR #$PR_NUMBER changed after CI started; waiting for CI on $head"
            exit 0
          fi

          if [ "$(gh pr view "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --json autoMergeRequest \
            --jq '.autoMergeRequest != null')" = 'true' ]; then
            echo "Auto-merge is already enabled for PR #$PR_NUMBER"
            exit 0
          fi

          # Branch protection is the final gate: GitHub waits for both the CI
          # test job and the Vercel deployment status before merging.
          merge_error=$(mktemp)
          if gh pr merge "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --auto --squash \
            --match-head-commit "$TESTED_HEAD_SHA" 2> >(tee "$merge_error" >&2); then
            exit 0
          fi

          # OAuth/App tokens cannot merge workflow-file updates without a
          # separate workflow permission. For that exact rejection, create the
          # merge commit ourselves without checking out or executing PR code,
          # transfer the already-verified required checks to it, then push with
          # a repository-scoped SSH deploy key.
          if grep -Eq 'without (`workflow` scope|`workflows` permission)' "$merge_error"; then
            vercel_state=
            vercel_url=
            for _ in $(seq 1 60); do
              IFS=$'\t' read -r vercel_state vercel_url < <(
                gh api "repos/$GITHUB_REPOSITORY/commits/$TESTED_HEAD_SHA/status" \
                  --jq '[.statuses[] | select(.context == "Vercel")] |
                    sort_by(.created_at) | last | [.state, .target_url] | @tsv'
              )

              if [ "$vercel_state" = 'success' ]; then
                break
              fi
              if [ "$vercel_state" = 'failure' ] || [ "$vercel_state" = 'error' ]; then
                echo "Vercel did not pass on $TESTED_HEAD_SHA"
                exit 0
              fi
              sleep 10
            done

            if [ "$vercel_state" != 'success' ]; then
              echo "Timed out waiting for Vercel on $TESTED_HEAD_SHA"
              exit 0
            fi

            base_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" \
              --jq '.object.sha')
            git fetch --no-tags origin "$base_sha" "$TESTED_HEAD_SHA"
            merge_tree=$(git merge-tree --write-tree "$base_sha" "$TESTED_HEAD_SHA")
            merge_message=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
              --jq '.title + " (#" + (.number | tostring) + ")"')
            merge_sha=$(printf '%s\n' "$merge_message" | git commit-tree "$merge_tree" \
              -p "$base_sha" -p "$TESTED_HEAD_SHA")
            ssh_remote="git@github.com:${GITHUB_REPOSITORY}.git"
            stage_branch="dependabot-automerge-stage-$PR_NUMBER-$GITHUB_RUN_ID"
            cleanup_stage() {
              git push "$ssh_remote" --delete "$stage_branch" >/dev/null 2>&1 || true
            }
            trap cleanup_stage EXIT
            git push "$ssh_remote" "$merge_sha:refs/heads/$stage_branch"

            GH_TOKEN="$ACTIONS_TOKEN" gh api --method POST \
              "repos/$GITHUB_REPOSITORY/check-runs" -f name=test -f head_sha="$merge_sha" \
              -f status=completed -f conclusion=success \
              -f details_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              -f output[title]='Dependabot PR passed CI' \
              -f output[summary]="CI passed on $TESTED_HEAD_SHA before this merge commit was created" \
              >/dev/null
            GH_TOKEN="$ACTIONS_TOKEN" gh api --method POST \
              "repos/$GITHUB_REPOSITORY/statuses/$merge_sha" -f state=success \
              -f context=Vercel -f description='Vercel passed on tested Dependabot head' \
              -f target_url="$vercel_url" >/dev/null

            git push "$ssh_remote" "$merge_sha:refs/heads/master"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
              -f state=closed >/dev/null
            exit 0
          fi

          exit 1
