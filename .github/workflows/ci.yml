name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep one CI run per branch/ref and replace stale runs after new commits.
  group: ci-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.2.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run quality checks
        run: pnpm quality
      - name: Run tests
        run: pnpm test
      - name: Build production bundle
        run: pnpm build
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
          DIRECT_URL: postgresql://postgres@127.0.0.1:5432/postgres
          IS_IN_MAINTENANCE_MODE: 'false'
          MONGO_URL: mongodb://127.0.0.1:27017/dotabod
          NEXT_TELEMETRY_DISABLED: '1'
          NEXTAUTH_SECRET: github-actions-build-secret
          NEXTAUTH_URL: http://127.0.0.1:3000
          OPENNODE_API_KEY: dummy-opennode-key
          STRIPE_SECRET_KEY: sk_test_dummy
          TWITCH_CLIENT_ID: dummy-client-id
          TWITCH_CLIENT_SECRET: dummy-client-secret
          VERCEL: '1'
