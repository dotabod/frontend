name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep one CI run per branch/ref and replace stale runs after new commits.
  group: ci-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: dotabod_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dotabod_test" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.2.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare webhook reliability database
        run: pnpm exec prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dotabod_test
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/dotabod_test
      - name: Prove webhook transaction reliability
        run: >-
          pnpm exec vitest run src/__tests__/pages/api/stripe/utils/idempotency.postgres.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dotabod_test
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/dotabod_test
          RUN_STRIPE_WEBHOOK_POSTGRES_TESTS: 'true'
      - name: Diagnose preview auth lint
        run: >-
          pnpm exec oxlint --disable-nested-config --config oxlint.config.ts --type-aware
          scripts/deploy-cloudflare-preview.mjs scripts/lib/cloudflare-preview-auth.mjs
          scripts/__tests__/cloudflare-preview-auth.test.mjs
      - name: Run quality checks
        run: pnpm quality
      - name: Run tests
        run: pnpm test
      - name: Build production bundle
        run: pnpm build
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
          DIRECT_URL: postgresql://postgres@127.0.0.1:5432/postgres
          IS_IN_MAINTENANCE_MODE: 'false'
          MONGO_URL: mongodb://127.0.0.1:27017/dotabod
          NEXT_TELEMETRY_DISABLED: '1'
          NEXTAUTH_SECRET: github-actions-build-secret
          NEXTAUTH_URL: http://127.0.0.1:3000
          OPENNODE_API_KEY: dummy-opennode-key
          STRIPE_SECRET_KEY: sk_test_dummy
          TWITCH_CLIENT_ID: dummy-client-id
          TWITCH_CLIENT_SECRET: dummy-client-secret
          VERCEL: '1'
      - name: Build vinext production bundle
        run: pnpm build:vinext
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
          DIRECT_URL: postgresql://postgres@127.0.0.1:5432/postgres
          IS_IN_MAINTENANCE_MODE: 'false'
          MONGO_URL: mongodb://127.0.0.1:27017/dotabod
          NEXT_TELEMETRY_DISABLED: '1'
          NEXTAUTH_SECRET: github-actions-build-secret
          NEXTAUTH_URL: http://127.0.0.1:3000
          OPENNODE_API_KEY: dummy-opennode-key
          STRIPE_SECRET_KEY: sk_test_dummy
          TWITCH_CLIENT_ID: dummy-client-id
          TWITCH_CLIENT_SECRET: dummy-client-secret
          VERCEL_ENV: production
      - name: Validate Cloudflare Worker bundle
        run: pnpm exec wrangler deploy --dry-run
      - name: Smoke test Cloudflare Worker runtime
        shell: bash
        env:
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgresql://postgres:postgres@127.0.0.1:5432/dotabod_test
        run: |
          set -euo pipefail

          log_file="${RUNNER_TEMP}/wrangler.log"
          pnpm exec wrangler dev \
            --port 8787 \
            --var DATABASE_URL:postgresql://postgres@127.0.0.1:5432/postgres \
            --var DIRECT_URL:postgresql://postgres@127.0.0.1:5432/postgres \
            --var IS_IN_MAINTENANCE_MODE:false \
            --var MONGO_URL:mongodb://127.0.0.1:27017/dotabod \
            --var NEXTAUTH_SECRET:github-actions-build-secret \
            --var NEXTAUTH_URL:http://127.0.0.1:8787 \
            --var OPENNODE_API_KEY:dummy-opennode-key \
            --var STRIPE_SECRET_KEY:sk_test_dummy \
            --var TWITCH_CLIENT_ID:dummy-client-id \
            --var TWITCH_CLIENT_SECRET:dummy-client-secret \
            --var VERCEL_ENV:production \
            >"${log_file}" 2>&1 &
          worker_pid=$!
          trap 'kill "${worker_pid}" 2>/dev/null || true' EXIT

          if ! curl --fail --silent --show-error \
            --retry 30 \
            --retry-connrefused \
            --retry-delay 1 \
            http://127.0.0.1:8787/maintenance \
            >/dev/null; then
            cat "${log_file}"
            exit 1
          fi

          if ! curl --fail --silent --show-error \
            http://127.0.0.1:8787/api/auth/providers \
            >/dev/null; then
            cat "${log_file}"
            exit 1
          fi

          for smoke_path in \
            /api/latest-post \
            /blog \
            /blog/crypto-payments-nowpayments; do
            if ! curl --fail --silent --show-error \
              "http://127.0.0.1:8787${smoke_path}" \
              >/dev/null; then
              cat "${log_file}"
              exit 1
            fi
          done
