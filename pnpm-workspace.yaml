nodeLinker: hoisted

publicHoistPattern:
  - '*prisma*'

# typography's peer expression includes the non-semver token `insiders`;
# allow the installed stable Tailwind release until upstream corrects it.
peerDependencyRules:
  allowedVersions:
    tailwindcss: '4.3.3'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry/cli': true
  lefthook: true
  prisma: true
  sharp: true
